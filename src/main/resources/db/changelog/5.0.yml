databaseChangeLog:
  - changeSet:
      id: create-withdrawal-table
      author: laman
      changes:
        - createTable:
            tableName: withdrawal_table
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_withdrawal
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: courier_balance_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: withdrawal_table
            baseColumnNames: courier_balance_id
            constraintName: fk_withdrawal_courier_balance
            referencedTableName: courier_balances
            referencedColumnNames: id
            onDelete: CASCADE