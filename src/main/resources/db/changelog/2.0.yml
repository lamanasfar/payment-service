databaseChangeLog:
  - changeSet:
      id: create-courier-balances-table
      author: laman

      changes:
        - createTable:
            tableName: courier_balances

            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_courier_balances
                    nullable: false

              - column:
                  name: courier_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: balance
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: turnover
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false