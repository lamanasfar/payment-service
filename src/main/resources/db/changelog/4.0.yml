databaseChangeLog:
  - changeSet:
      id: create-payment-table
      author: laman

      changes:
        - createTable:
            tableName: payment_table

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_payment_table
                    nullable: false

              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: courier_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: order_amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: courier_earning
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: completed_at
                  type: TIMESTAMP